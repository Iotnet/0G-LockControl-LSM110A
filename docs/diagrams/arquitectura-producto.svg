  <text x="460" y="729" fill="#c3b1ff" font-size="15" font-weight="800" text-anchor="middle">Sección RF — certificada FCC (datos User Manual 5937666)</text>

  <g filter="url(#dsS)"><rect x="146" y="756" width="188" height="86" rx="10" fill="url(#chip)" stroke="#8b72dd"/></g>
