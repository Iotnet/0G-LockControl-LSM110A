    <rect x="672" y="404" width="204" height="92" rx="12" fill="url(#card)" stroke="#2d5f9e"/>
  </g>
  <rect x="672" y="404" width="204" height="28" rx="12" fill="#2d5f9e" opacity="0.2"/>
  <text x="774" y="424" fill="#79b3f5" font-size="13.5" font-weight="700" text-anchor="middle">UART debug</text>
  <text x="774" y="452" fill="#dfe5ec" font-size="11" text-anchor="middle">PB6 TX · PB7 RX</text>
  <text x="774" y="470" fill="#8792a2" font-size="10.5" font-style="italic" text-anchor="middle">no poblar en producción</text>

  <g filter="url(#ds)">
    <rect x="672" y="512" width="204" height="106" rx="12" fill="url(#card)" stroke="#2d5f9e"/>
  </g>
  <rect x="672" y="512" width="204" height="28" rx="12" fill="#2d5f9e" opacity="0.2"/>
  <text x="774" y="532" fill="#79b3f5" font-size="13.5" font-weight="700" text-anchor="middle">NRST + BOOT0</text>
  <text x="774" y="560" fill="#dfe5ec" font-size="11" text-anchor="middle">pin 30 · cap 100 nF</text>
  <text x="774" y="578" fill="#dfe5ec" font-size="11" text-anchor="middle">pin 31 · BOOT0 flotante</text>
  <text x="774" y="596" fill="#8792a2" font-size="10.5" text-anchor="middle">pulldown interno</text>

  <line x1="648" y1="337" x2="670" y2="337" stroke="#79b3f5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="648" y1="450" x2="670" y2="450" stroke="#79b3f5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="648" y1="565" x2="670" y2="565" stroke="#79b3f5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Flecha RFOUT -->
  <line x1="477" y1="642" x2="477" y2="690" stroke="#c3b1ff" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="392" y="652" width="170" height="22" rx="11" fill="#141a22" stroke="#3a4656"/>
  <text x="477" y="667" fill="#aeb8c6" font-size="11" text-anchor="middle">Pin 33 · RFOUT 50 Ω</text>

  <!-- ===== Sección RF ===== -->
  <g filter="url(#ds)">
    <rect x="120" y="706" width="680" height="176" rx="14" fill="url(#card)" stroke="#7a5fd0" stroke-width="1.4"/>
  </g>
