<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1120" font-family="Segoe UI, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232d"/>
      <stop offset="1" stop-color="#141a22"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c38"/>
      <stop offset="1" stop-color="#1a212b"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="dsS" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="920" height="1120" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="919" height="1119" rx="18" fill="none" stroke="#2a3340"/>

  <!-- ===== Título ===== -->
  <text x="460" y="52" fill="#eef2f7" font-size="24" font-weight="700" text-anchor="middle">Arquitectura del producto final — 0G LockControl</text>
  <text x="460" y="78" fill="#8792a2" font-size="13.5" text-anchor="middle">Spec v1.0 · Sigfox RC2 (902–928 MHz México) · firmware API sobre LSM110A · Stop2 ≈ 3 µA</text>

  <!-- ===== Alimentación ===== -->
  <g filter="url(#ds)">
    <rect x="44" y="104" width="520" height="118" rx="12" fill="url(#card)" stroke="#8a5a1e"/>
  </g>
  <rect x="44" y="104" width="520" height="30" rx="12" fill="#8a5a1e" opacity="0.16"/>
  <text x="304" y="125" fill="#e8b46a" font-size="14.5" font-weight="700" text-anchor="middle">Alimentación</text>

  <g filter="url(#dsS)"><rect x="62" y="148" width="128" height="56" rx="9" fill="url(#chip)" stroke="#a06a24"/></g>
  <text x="126" y="171" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle">CR2450</text>
  <text x="126" y="189" fill="#c99a55" font-size="11" text-anchor="middle">3 V · 620 mAh</text>

  <g filter="url(#dsS)"><rect x="216" y="148" width="140" height="56" rx="9" fill="url(#chip)" stroke="#a06a24"/></g>
  <text x="286" y="168" fill="#eef2f7" font-size="12.5" font-weight="700" text-anchor="middle">Cap 470 µF</text>
  <text x="286" y="184" fill="#c99a55" font-size="10.5" text-anchor="middle">soporte pulso TX</text>
  <text x="286" y="198" fill="#8792a2" font-size="9.5" text-anchor="middle">GATE 2: Vmin ≥ 2.5 V</text>

  <g filter="url(#dsS)"><rect x="382" y="148" width="164" height="56" rx="9" fill="url(#chip)" stroke="#a06a24"/></g>
  <text x="464" y="168" fill="#eef2f7" font-size="12.5" font-weight="700" text-anchor="middle">LDO TPS7A02 + bypass 0 Ω</text>
  <text x="464" y="184" fill="#c99a55" font-size="10.5" text-anchor="middle">footprint opcional (3.0 V)</text>
  <text x="464" y="198" fill="#8792a2" font-size="9.5" text-anchor="middle">DT-003 · config dual</text>

  <line x1="190" y1="176" x2="214" y2="176" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="356" y1="176" x2="380" y2="176" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Desacoplo ===== -->
  <g filter="url(#ds)">
    <rect x="588" y="104" width="288" height="118" rx="12" fill="url(#card)" stroke="#8a5a1e"/>
  </g>
  <rect x="588" y="104" width="288" height="30" rx="12" fill="#8a5a1e" opacity="0.16"/>
  <text x="732" y="125" fill="#e8b46a" font-size="14.5" font-weight="700" text-anchor="middle">Desacoplo VDD</text>
  <text x="732" y="165" fill="#dfe5ec" font-size="12.5" text-anchor="middle">100 nF ×4 (cerámico) + 10 µF bulk</text>
  <text x="732" y="186" fill="#8792a2" font-size="11" text-anchor="middle">a &lt; 2 mm del pin 11</text>

