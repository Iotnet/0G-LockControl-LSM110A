  <text x="240" y="801" fill="#c3b1ff" font-size="11" text-anchor="middle">0 Ω serie · 2.2 pF shunt</text>
  <text x="240" y="818" fill="#c3b1ff" font-size="11" text-anchor="middle">+ C102 DNI · 0402</text>

  <g filter="url(#dsS)"><rect x="366" y="756" width="188" height="86" rx="10" fill="url(#chip)" stroke="#8b72dd"/></g>
