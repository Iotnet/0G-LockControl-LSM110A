  <rect x="356" y="230" width="208" height="22" rx="11" fill="#141a22" stroke="#3a4656"/>
  <text x="460" y="245" fill="#aeb8c6" font-size="11" text-anchor="middle">Pin 11 · VDD 3.0 V directo</text>

  <!-- ===== Bus I2C (izq) ===== -->
  <g filter="url(#ds)">
    <rect x="44" y="282" width="238" height="160" rx="12" fill="url(#card)" stroke="#2f6b3a"/>
  </g>
  <rect x="44" y="282" width="238" height="30" rx="12" fill="#2f6b3a" opacity="0.18"/>
  <text x="163" y="303" fill="#7fd68b" font-size="14" font-weight="700" text-anchor="middle">Bus I²C</text>
  <text x="163" y="332" fill="#dfe5ec" font-size="11.5" text-anchor="middle">PA9 SCL · PA10 SDA</text>
  <text x="163" y="349" fill="#8792a2" font-size="11" text-anchor="middle">pull-ups 4.7 kΩ</text>

  <g filter="url(#dsS)"><rect x="62" y="364" width="202" height="60" rx="9" fill="url(#chip)" stroke="#3f8a4c"/></g>
  <text x="163" y="388" fill="#eef2f7" font-size="12.5" font-weight="700" text-anchor="middle">LIS2DW12 (acel)</text>
  <text x="163" y="406" fill="#7fd68b" font-size="10.5" text-anchor="middle">umbral 200 mg · INT1 → PA0 (EXTI0)</text>

  <!-- ===== Sensor magnético (izq abajo) ===== -->
  <g filter="url(#ds)">
    <rect x="44" y="466" width="238" height="176" rx="12" fill="url(#card)" stroke="#2f6b3a"/>
  </g>
  <rect x="44" y="466" width="238" height="30" rx="12" fill="#2f6b3a" opacity="0.18"/>
  <text x="163" y="487" fill="#7fd68b" font-size="14" font-weight="700" text-anchor="middle">Sensor magnético</text>
  <text x="163" y="514" fill="#8792a2" font-size="11" text-anchor="middle">apertura puerta / ventana · PA1 (EXTI1)</text>

  <g filter="url(#dsS)"><rect x="62" y="528" width="202" height="42" rx="9" fill="url(#chip)" stroke="#3f8a4c"/></g>
  <text x="163" y="554" fill="#eef2f7" font-size="12" font-weight="700" text-anchor="middle">Reed switch NA</text>

  <g filter="url(#dsS)"><rect x="62" y="580" width="202" height="42" rx="9" fill="url(#chip)" stroke="#3f8a4c"/></g>
  <text x="163" y="606" fill="#eef2f7" font-size="12" font-weight="700" text-anchor="middle">Hall DRV5032 (SMD)</text>

  <text x="163" y="634" fill="#7fd68b" font-size="10" font-style="italic" text-anchor="middle">ambos footprints en PCB · DT-001</text>

  <!-- ===== LSM110A (centro) ===== -->
  <g filter="url(#ds)">
    <rect x="306" y="282" width="342" height="360" rx="14" fill="url(#card)" stroke="#4a63c9" stroke-width="1.4"/>
  </g>
  <rect x="306" y="282" width="342" height="34" rx="14" fill="#4a63c9" opacity="0.18"/>
  <text x="477" y="305" fill="#93a8ff" font-size="15.5" font-weight="800" text-anchor="middle">LSM110A — firmware API</text>

  <text x="477" y="336" fill="#dfe5ec" font-size="12" text-anchor="middle">STM32WLE5 · ARM Cortex-M4 @ 48 MHz</text>
  <text x="477" y="354" fill="#8792a2" font-size="11" text-anchor="middle">256 KB Flash · 64 KB RAM · radio sub-GHz integrado</text>
  <text x="477" y="372" fill="#8792a2" font-size="11" text-anchor="middle">TX default +14 dBm · el código C corre dentro del módulo</text>

  <g filter="url(#dsS)"><rect x="326" y="390" width="146" height="42" rx="9" fill="#1a2540" stroke="#5a74d9"/></g>
  <text x="399" y="416" fill="#a9baff" font-size="11.5" font-weight="700" text-anchor="middle">Sigfox stack (SJI)</text>

  <g filter="url(#dsS)"><rect x="482" y="390" width="146" height="42" rx="9" fill="#14261c" stroke="#3f8a4c"/></g>
  <text x="555" y="416" fill="#7fd68b" font-size="11.5" font-weight="700" text-anchor="middle">Drivers I²C + EXTI</text>

  <g filter="url(#dsS)"><rect x="326" y="444" width="302" height="42" rx="9" fill="#14261c" stroke="#3f8a4c"/></g>
  <text x="477" y="470" fill="#7fd68b" font-size="11.5" font-weight="700" text-anchor="middle">Low-power manager · Stop2 ≈ 3 µA · IWDG 4 s</text>

  <g filter="url(#dsS)"><rect x="326" y="498" width="302" height="42" rx="9" fill="#231a40" stroke="#7a5fd0"/></g>
  <text x="477" y="524" fill="#c3b1ff" font-size="11.5" font-weight="700" text-anchor="middle">Heartbeat 24 h · cooldown 60 s · máx 130 msg/día</text>

  <text x="477" y="566" fill="#5d6b7e" font-size="10.5" text-anchor="middle">stack SJI no se modifica → preserva Sigfox Verified + FCC (DT-004)</text>
  <text x="477" y="584" fill="#5d6b7e" font-size="10.5" text-anchor="middle">payload 12 bytes congelado v1.0 · codec en repo</text>

  <!-- Flechas sensores → módulo -->
  <line x1="282" y1="394" x2="304" y2="394" stroke="#7fd68b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="282" y1="552" x2="304" y2="552" stroke="#7fd68b" stroke-width="1.6" marker-end="url(#a)"/>

