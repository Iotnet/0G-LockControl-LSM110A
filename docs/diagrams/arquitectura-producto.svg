  <text x="460" y="801" fill="#c3b1ff" font-size="11" text-anchor="middle">1.0 mm / gap 0.15 mm</text>
  <text x="460" y="818" fill="#8792a2" font-size="10.5" text-anchor="middle">FR4 1.6 mm · εr 4.3 · no microstrip</text>

  <g filter="url(#dsS)"><rect x="586" y="756" width="188" height="86" rx="10" fill="url(#chip)" stroke="#8b72dd"/></g>
  <text x="680" y="778" fill="#eef2f7" font-size="12.5" font-weight="700" text-anchor="middle">Antena EVB_LSM ANT</text>
  <text x="680" y="796" fill="#c3b1ff" font-size="11" text-anchor="middle">serpentín SJI · 1.9 dBi</text>
  <text x="680" y="812" fill="#8792a2" font-size="10" text-anchor="middle">Gerber confidencial (NDA)</text>
  <text x="680" y="827" fill="#8792a2" font-size="10" text-anchor="middle">copia exacta → preserva FCC</text>

  <line x1="334" y1="799" x2="364" y2="799" stroke="#c3b1ff" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="554" y1="799" x2="584" y2="799" stroke="#c3b1ff" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="460" y="866" fill="#5d6b7e" font-size="10.5" text-anchor="middle">keepout total en antena · GND sólido sin cortes · via stitching · separación ≥ 20 cm a personas (RF exposure)</text>

  <!-- ===== Ciclo ===== -->
  <g filter="url(#ds)">
    <rect x="44" y="912" width="832" height="176" rx="14" fill="url(#card)" stroke="#3a4656"/>
  </g>
  <rect x="44" y="912" width="832" height="34" rx="14" fill="#3a4656" opacity="0.35"/>
  <text x="460" y="935" fill="#eef2f7" font-size="15" font-weight="800" text-anchor="middle">Ciclo de operación event-driven</text>

  <text x="460" y="972" fill="#7fd68b" font-size="13" font-weight="700" text-anchor="middle">Sleep ≈ 3 µA → Wake INT (PA0 acel ó PA1 mag) → Lectura sensor</text>
  <text x="460" y="994" fill="#c3b1ff" font-size="13" font-weight="700" text-anchor="middle">→ TX Sigfox +14 dBm ≈ 50 mA × 2 s → Sleep</text>

  <text x="460" y="1024" fill="#aeb8c6" font-size="11.5" text-anchor="middle">Payload 12 bytes · Heartbeat 24 h · Cooldown 60 s · Máx. 130 msg/día (límite Sigfox 140)</text>
  <text x="460" y="1044" fill="#aeb8c6" font-size="11.5" text-anchor="middle">CR2450 + cap 470 µF → autonomía de meses a años según frecuencia de eventos</text>
  <text x="460" y="1068" fill="#5d6b7e" font-size="10.5" font-style="italic" text-anchor="middle">Uso interior (oficina, bodega, cuarto frío) · dimensiones finales sujetas a antena SJI (ref 50×80 mm)</text>
</svg>
